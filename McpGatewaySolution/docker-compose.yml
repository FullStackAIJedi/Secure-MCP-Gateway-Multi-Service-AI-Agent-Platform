services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: mcp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - mcp-postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  taskservice:
    build:
      context: .
      dockerfile: src/Services/TaskService.Api/Dockerfile
    container_name: mcp-taskservice
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__taskdb: "Host=postgres;Database=${TASK_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: taskservice
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=docker,service.version=1.0.0"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    ports:
      - "${TASKSERVICE_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  documentservice:
    build:
      context: .
      dockerfile: src/Services/DocumentService.Api/Dockerfile
    container_name: mcp-documentservice
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__documentdb: "Host=postgres;Database=${DOCUMENT_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: documentservice
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=docker,service.version=1.0.0"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    ports:
      - "${DOCUMENTSERVICE_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Gateway.Api/Dockerfile
    container_name: mcp-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      OAuth__Authority: ${OAUTH_AUTHORITY}
      OAuth__Audience: ${OAUTH_AUDIENCE}

      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}

      ConnectionStrings__userdb: "Host=postgres;Database=${USER_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"

      services__taskservice__http__0: "http://taskservice:8080"
      services__documentservice__http__0: "http://documentservice:8080"

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: gateway
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=docker,service.version=1.0.0"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    volumes:
      - gateway-keys:/app/keys
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      taskservice:
        condition: service_started
      documentservice:
        condition: service_started

  agent:
    build:
      context: .
      dockerfile: src/Agent/Agent.Api/Dockerfile
    container_name: mcp-agent
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Ollama__BaseUrl: ${OLLAMA_BASE_URL}
      Ollama__Model: ${OLLAMA_MODEL}
      Gateway__McpUrl: ${AGENT_GATEWAY_URL}

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: agent
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=docker,service.version=1.0.0"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    ports:
      - "${AGENT_PORT}:8080"
    depends_on:
      gateway:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: mcp-otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: mcp-aspire-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "18889:18889"
    restart: unless-stopped

volumes:
  mcp-postgres-data:
  gateway-keys: